<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogiMacro - Crawler Only</title>
<style>body{background:#0f172a;color:#e2e8f0;font-family:sans-serif;padding:20px}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:12px}.error{background:#450a0a;border:1px solid #dc2626;color:#fecaca;padding:10px;border-radius:8px;white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}button{padding:10px 16px;background:#2563eb;border:0;border-radius:8px;color:#fff;cursor:pointer}</style>
</head><body>
<h1>LogiMacro AI - Crawler ONLY (API 0개)</h1>
<p>Worker가 직접 크롤링해서 D1에 저장한 데이터만 표시합니다.</p>
<button onclick="crawl()">🔄 지금 크롤링 실행 (/api/crawl)</button> <span id="status"></span>
<div class="grid" id="freight-grid"></div>
<h2>📰 뉴스 (Google News RSS 크롤러)</h2>
<div id="news-list"></div>
<div id="error"></div>
<script>
const WORKER="https://logimacro-ai.hh87kor.workers.dev";
async function load(){
  try{
    const r=await fetch(`${WORKER}/api/dashboard`);
    const d=await r.json();
    if(!r.ok||d.error) throw new Error(d.message);
    document.getElementById("freight-grid").innerHTML=d.freights.map(f=>`<div class="card"><b>${f.name}</b><br><span style="font-size:24px">${f.value}</span><br><small>${f.source} | ${f.created_at}</small></div>`).join("");
    document.getElementById("news-list").innerHTML=d.news.map(n=>`<div class="card"><a href="${n.url}" target="_blank" style="color:#60a5fa">${n.title}</a><br><small>${n.category} | ${n.source}</small></div>`).join("")||"뉴스 없음";
    document.getElementById("error").innerHTML="";
  }catch(e){
    document.getElementById("error").innerHTML=`<div class="error">❌ 대시보드 로드 실패\n${e.message}\n\n1. D1 테이블 생성했는지 확인\n2. /api/crawl 을 먼저 실행해야 데이터가 생깁니다.</div>`;
  }
}
async function crawl(){
  document.getElementById("status").textContent="크롤링 중...";
  try{
    const r=await fetch(`${WORKER}/api/crawl`);
    const d=await r.json();
    if(!r.ok||d.error) throw new Error(d.message);
    document.getElementById("status").textContent="완료: "+d.logs.join(", ");
    load();
  }catch(e){ document.getElementById("status").textContent="실패: "+e.message; }
}
load();
</script>
</body></html>
