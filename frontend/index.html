<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogiMacro AI - Real Data Only</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Pretendard',sans-serif;background:#0f172a;color:#e2e8f0;padding:24px}
h1{font-size:28px;margin-bottom:8px}.sub{color:#94a3b8;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px}
.card h3{font-size:14px;color:#94a3b8;margin-bottom:8px}
.card.value{font-size:32px;font-weight:700}
.card.meta{font-size:12px;margin-top:8px;color:#64748b}
.error{background:#7f1d1d;border-color:#dc2626;color:#fecaca;padding:12px;border-radius:8px;margin-top:12px;font-size:13px;white-space:pre-wrap}
.loading{color:#38bdf8}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:#334155}
</style>
</head>
<body>
<h1>LogiMacro AI <span class="badge">REAL MODE - NO MOCK</span></h1>
<p class="sub">mock값 0개 - 데이터 못 가져오면 에러를 표시합니다. Worker: https://logimacro-ai.hh87kor.workers.dev</p>

<div class="grid">
  <div class="card" id="card-oil">
    <h3>WTI 유가 (CL=F)</h3>
    <div class="value loading" id="oil-price">Loading...</div>
    <div class="meta" id="oil-meta"></div>
    <div id="oil-error"></div>
  </div>
  <div class="card" id="card-fx">
    <h3>USD/KRW 환율</h3>
    <div class="value loading" id="fx-price">Loading...</div>
    <div class="meta" id="fx-meta"></div>
    <div id="fx-error"></div>
  </div>
  <div class="card" id="card-freight">
    <h3>SCFI / 해상운임</h3>
    <div class="value loading" id="freight-price">Loading...</div>
    <div class="meta" id="freight-meta"></div>
    <div id="freight-error"></div>
  </div>
</div>

<script>
const WORKER = "https://logimacro-ai.hh87kor.workers.dev";

async function load(api, valueId, metaId, errorId) {
  const elVal = document.getElementById(valueId);
  const elMeta = document.getElementById(metaId);
  const elErr = document.getElementById(errorId);
  try {
    const res = await fetch(`${WORKER}${api}`);
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.message || `HTTP ${res.status}`);
    elErr.innerHTML = "";
    if (api === "/api/oil") {
      elVal.textContent = `$${data.price} (${data.changePct>0?'+':''}${data.changePct}%)`;
      elVal.className = "value";
      elMeta.textContent = `출처: ${data.source} | ${data.updatedAt}`;
    } else if (api === "/api/fx") {
      elVal.textContent = `${Number(data.KRW).toLocaleString()} 원`;
      elVal.className = "value";
      elMeta.textContent = `출처: ${data.source} | ${data.updatedAt}`;
    }
  } catch (e) {
    elVal.textContent = "ERROR";
    elVal.className = "value";
    elVal.style.color = "#f87171";
    elMeta.textContent = "";
    elErr.innerHTML = `<div class="error">❌ ${api} 조회 실패\n${e.message}\n\nWorker 로그를 확인하세요.</div>`;
  }
}

async function loadFreight() {
  const elVal = document.getElementById("freight-price");
  const elMeta = document.getElementById("freight-meta");
  const elErr = document.getElementById("freight-error");
  try {
    const res = await fetch(`${WORKER}/api/freight`);
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.message);
    elVal.textContent = data.value;
  } catch (e) {
    elVal.textContent = "ERROR";
    elVal.style.color = "#f87171";
    elMeta.textContent = "";
    elErr.innerHTML = `<div class="error">❌ /api/freight 조회 실패\n${e.message}\n\n이 항목은 공식 무료 API가 없어서 에러가 정상입니다. API 키를 연결하면 해결됩니다.</div>`;
  }
}

load("/api/oil","oil-price","oil-meta","oil-error");
load("/api/fx","fx-price","fx-meta","fx-error");
loadFreight();
</script>
</body>
</html>
